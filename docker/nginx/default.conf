server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    absolute_redirect off;

    client_max_body_size 32m;

    # Strona startowa pod /, sama gra pod /game/ — ten sam build.
    location = / {
        try_files /game/index.html =404;
    }

    location = /game {
        return 301 /game/;
    }

    location /game/ {
        index index.html;
        try_files $uri $uri/ /game/index.html;
    }

    location /assets/ {
        alias /var/www/html/public/game/assets/;
    }

    location /game/assets/ {
        alias /var/www/html/public/game/assets/;
    }

    # Zarezerwowane prefiksy Symfony — nie mogą trafić do buildu gry.
    location /api {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /admin {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass server:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
