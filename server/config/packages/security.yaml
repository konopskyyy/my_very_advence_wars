security:
    password_hashers:
        App\Auth\Domain\User\User: 'auto'

    providers:
        app_user_provider:
            id: App\Auth\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/auth/(register|login)$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Auth\Domain\User\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
